name: Проверка и релиз PowerDiscord

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/PowerDiscord.plugin.js
      - scripts/validate-powerdiscord.mjs
      - scripts/smoke-powerdiscord.mjs
      - docs/POWERDISCORD_FEATURES_RU.md
      - docs/powerdiscord-validation.json
      - .github/workflows/powerdiscord-release.yml

permissions:
  contents: write

concurrency:
  group: powerdiscord-release
  cancel-in-progress: true

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить синтаксис
        run: |
          node --check src/PowerDiscord.plugin.js
          node --check scripts/validate-powerdiscord.mjs

      - name: Проверить 100 функций и безопасность
        run: node scripts/validate-powerdiscord.mjs

      - name: Проверить lifecycle и оптимизации
        run: node scripts/smoke-powerdiscord.mjs

      - name: Собрать устанавливаемый файл
        run: |
          mkdir -p dist
          cp src/PowerDiscord.plugin.js dist/PowerDiscord.plugin.js
          sha256sum dist/PowerDiscord.plugin.js > dist/PowerDiscord.plugin.js.sha256

      - name: Сохранить артефакт проверки
        uses: actions/upload-artifact@v4
        with:
          name: PowerDiscord-3.1.0
          path: |
            dist/PowerDiscord.plugin.js
            dist/PowerDiscord.plugin.js.sha256
            docs/POWERDISCORD_FEATURES_RU.md
            docs/powerdiscord-validation.json

      - name: Опубликовать релиз
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: powerdiscord-v3.1.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/PowerDiscord.plugin.js \
              dist/PowerDiscord.plugin.js.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              dist/PowerDiscord.plugin.js \
              dist/PowerDiscord.plugin.js.sha256 \
              --title "PowerDiscord 3.1.0 — Chat Tools" \
              --notes "Фиолетовая версия с ровно 100 безопасными функциями: закреплённый одноразовый чек видимого чата без сохранения текста, номера строк и копирование кода, сохранение выбранного медиа/аватара, фильтры недоступных каналов и анимированных медиа, читаемый шрифт и горячие клавиши штатных голосовых кнопок. Без токенов, телеметрии, сетевого перехвата, журналирования сообщений и обхода прав Discord."
          fi
